<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>FahadFlix</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    *{box-sizing:border-box;margin:0;padding:0;font-family:Arial,Helvetica,sans-serif}
    body{background:#141414;color:#fff;min-height:100vh}
    header{display:flex;justify-content:space-between;align-items:center;padding:1rem;background:#000}
    header h1{color:#e50914}
    nav button{background:none;border:none;color:#fff;font-size:1rem;margin:0 .5rem;cursor:pointer}
    #content{padding:1rem}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:1rem}
    .card{background:#222;padding:.5rem;border-radius:8px;cursor:pointer;text-align:center}
    .card img{width:100%;border-radius:4px}
    .hidden{display:none}
    #player video{width:100%;max-height:80vh;background:#000}
    #login,#profiles{max-width:400px;margin:2rem auto;padding:2rem;background:#222;border-radius:8px}
    input,button{padding:.5rem;margin:.5rem 0;width:100%}
    button{background:#e50914;color:#fff;border:none;cursor:pointer;border-radius:4px}
    #seasonSelect{margin-bottom:1rem;padding:.5rem;width:200px}
  </style>
</head>
<body>
  <header>
    <h1>FahadFlix</h1>
    <nav>
      <button onclick="showPage('home')">Home</button>
      <button onclick="showPage('profiles')">Profiles</button>
      <button onclick="logout()">Logout</button>
    </nav>
  </header>

  <div id="content">
    <!-- Login Page -->
    <div id="login">
      <h2>Login</h2>
      <input id="email" type="email" placeholder="Email" />
      <input id="password" type="password" placeholder="Password" />
      <button onclick="login()">Login</button>
      <button onclick="signup()">Sign Up</button>
    </div>

    <!-- Profiles Page -->
    <div id="profiles" class="hidden">
      <h2>Select Profile</h2>
      <div id="profileList"></div>
      <input id="newProfileName" placeholder="New Profile Name" />
      <button onclick="addProfile()">Add Profile</button>
    </div>

    <!-- Home Page -->
    <div id="home" class="hidden">
      <h2>Movies & Shows</h2>
      <select id="seasonSelect" onchange="loadSeason()"></select>
      <div class="grid" id="movieGrid"></div>
    </div>

    <!-- Player Page -->
    <div id="player" class="hidden">
      <video id="videoPlayer" controls></video>
      <button onclick="showPage('home')">Back</button>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
  <script>
    const firebaseConfig = {
apiKey: "AIzaSyCvd_IgPL3_gYjhfplngBboHWjSLRIhhIE",
  authDomain: "fahadflix-storage.firebaseapp.com",
  databaseURL: "https://fahadflix-storage-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "fahadflix-storage",
  storageBucket: "fahadflix-storage.appspot.com",
  messagingSenderId: "1064833913945",
  appId: "1:1064833913945:web:bf711e8b364fcfdf2b8d48"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    let currentUser = null;
    let moviesData = {};
    let currentSeason = "Season 1";

    function showPage(page){
      document.querySelectorAll("#content > div").forEach(d=>d.classList.add("hidden"));
      document.getElementById(page).classList.remove("hidden");
    }

    function login(){
      const email=document.getElementById("email").value;
      const password=document.getElementById("password").value;
      auth.signInWithEmailAndPassword(email,password).catch(alert);
    }
    function signup(){
      const email=document.getElementById("email").value;
      const password=document.getElementById("password").value;
      auth.createUserWithEmailAndPassword(email,password).catch(alert);
    }
    function logout(){auth.signOut();}

    auth.onAuthStateChanged(user=>{
      if(user){currentUser=user; loadProfiles(); showPage('profiles');}
      else{currentUser=null; showPage('login');}
    });

    function loadProfiles(){
      db.ref("profiles/"+currentUser.uid).once("value",snap=>{
        const list=document.getElementById("profileList");
        list.innerHTML="";
        snap.forEach(c=>{
          const btn=document.createElement("button");
          btn.textContent=c.key;
          btn.onclick=()=>{loadMovies(); showPage('home');};
          list.appendChild(btn);
        });
      });
    }
    function addProfile(){
      const name=document.getElementById("newProfileName").value;
      if(!name)return;
      db.ref("profiles/"+currentUser.uid+"/"+name).set(true);
      loadProfiles();
    }

    async function loadMovies(){
      const res=await fetch("https://raw.githubusercontent.com/FXHDLE112/tes-html/refs/heads/main/movies.json");
      moviesData=await res.json();
      const seasonSelect=document.getElementById("seasonSelect");
      seasonSelect.innerHTML="";
      Object.keys(moviesData).forEach(season=>{
        const opt=document.createElement("option");
        opt.value=season;
        opt.textContent=season;
        seasonSelect.appendChild(opt);
      });
      currentSeason=Object.keys(moviesData)[0];
      seasonSelect.value=currentSeason;
      renderMovies();
    }
    function loadSeason(){
      currentSeason=document.getElementById("seasonSelect").value;
      renderMovies();
    }
    function renderMovies(){
      const grid=document.getElementById("movieGrid");
      grid.innerHTML="";
      const season=moviesData[currentSeason];
      if(!season)return;
      season.forEach(show=>{
        const card=document.createElement("div");
        card.className="card";
        card.innerHTML=`<img src="${show.thumbnail}" alt=""><p>${show.title}</p>`;
        card.onclick=()=>openPlayer(show.title,show.src,show.subs);
        grid.appendChild(card);
      });
    }

    // 🔹 Fixed iOS-safe video player
    async function openPlayer(title, src, subs) {
      showPage('player');

      const videoPlayer=document.getElementById("videoPlayer");
      videoPlayer.innerHTML="";

      const source=document.createElement("source");
      source.src=src||'';
      source.type="video/mp4";
      videoPlayer.appendChild(source);

      videoPlayer.setAttribute("playsinline","");
      videoPlayer.setAttribute("webkit-playsinline","");

      if(currentUser){
        const snapshot=await db.ref(`resume/${currentUser.uid}/${title}`).once('value');
        if(snapshot.exists()){videoPlayer.currentTime=snapshot.val();}
      }

      videoPlayer.ontimeupdate=()=>{
        if(!videoPlayer.paused) saveResumeTime(title, videoPlayer.currentTime);
      };

      if(subs){
        const track=document.createElement("track");
        track.src=subs;
        track.kind="subtitles";
        track.srclang="en";
        track.label="English";
        videoPlayer.appendChild(track);
      }

      videoPlayer.load();
      videoPlayer.play().catch(()=>{});
    }

    function saveResumeTime(title,time){
      if(currentUser){
        db.ref(`resume/${currentUser.uid}/${title}`).set(time);
      }
    }
  </script>
</body>
</html>
