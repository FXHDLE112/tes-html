<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>FahadFlix</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    body{margin:0;background:#141414;color:#fff;font-family:sans-serif}
    header{background:#000;padding:10px;text-align:center}
    #profiles,#home,#player{display:none;padding:20px}
    .profile{cursor:pointer;margin:10px;display:inline-block}
    .movie{cursor:pointer;margin:10px;display:inline-block;width:150px}
    video{width:100%;max-height:70vh;background:#000}
  </style>
</head>
<body>
  <header><h1>FahadFlix</h1></header>

  <!-- Profiles -->
  <section id="profiles">
    <h2>Select Profile</h2>
    <div id="profileList"></div>
    <button onclick="createProfile()">Add Profile</button>
  </section>

  <!-- Home -->
  <section id="home">
    <h2>Movies</h2>
    <input type="text" id="searchInput" placeholder="Search..." oninput="renderMovies()" />
    <div id="moviesList"></div>
    <button onclick="logout()">Logout</button>
  </section>

  <!-- Player -->
  <section id="player">
    <video id="videoPlayer" controls playsinline webkit-playsinline></video>
    <button onclick="closePlayer()">Close</button>
  </section>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <script>
    const firebaseConfig = {
apiKey: "AIzaSyCvd_IgPL3_gYjhfplngBboHWjSLRIhhIE",
  authDomain: "fahadflix-storage.firebaseapp.com",
  databaseURL: "https://fahadflix-storage-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "fahadflix-storage",
  storageBucket: "fahadflix-storage.appspot.com",
  messagingSenderId: "1064833913945",
  appId: "1:1064833913945:web:bf711e8b364fcfdf2b8d48"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    let currentUser = null;
    let moviesData = {};
    let currentProfile = null;

    // GitHub movies.json
    const MOVIES_URL = "https://raw.githubusercontent.com/FXHDLE112/tes-html/refs/heads/main/movies.json";

    auth.onAuthStateChanged(user=>{
      if(user){
        currentUser = user;
        showPage('profiles');
        loadProfiles();
        loadMovies();
      } else {
        auth.signInAnonymously();
      }
    });

    function showPage(id){
      document.querySelectorAll('section').forEach(s=>s.style.display='none');
      document.getElementById(id).style.display='block';
    }

    async function loadProfiles(){
      const snap = await db.ref('profiles/'+currentUser.uid).once('value');
      const profiles = snap.val()||{};
      const div = document.getElementById('profileList');
      div.innerHTML='';
      Object.keys(profiles).forEach(k=>{
        const d=document.createElement('div');
        d.className='profile';
        d.innerText=profiles[k].name;
        d.onclick=()=>selectProfile(k,profiles[k].name);
        div.appendChild(d);
      });
    }

    function createProfile(){
      const name = prompt("Profile name?");
      if(!name) return;
      const id = Date.now();
      db.ref('profiles/'+currentUser.uid+'/'+id).set({name});
      loadProfiles();
    }

    function selectProfile(id,name){
      currentProfile={id,name};
      showPage('home');
      renderMovies();
    }

    async function loadMovies(){
      const res = await fetch(MOVIES_URL);
      moviesData = await res.json();
      renderMovies();
    }

    function renderMovies(){
      const search=document.getElementById('searchInput').value.toLowerCase();
      const div=document.getElementById('moviesList');
      div.innerHTML='';
      Object.keys(moviesData).forEach(title=>{
        if(title.toLowerCase().includes(search)){
          const m=document.createElement('div');
          m.className='movie';
          m.innerText=title;
          m.onclick=()=>openPlayer(title,moviesData[title].src,moviesData[title].subs);
          div.appendChild(m);
        }
      });
    }

    // ✅ Fixed openPlayer for iOS
    async function openPlayer(title, src, subs) {
      showPage('player');
      const videoPlayer=document.getElementById('videoPlayer');
      videoPlayer.innerHTML="";

      const source=document.createElement('source');
      source.src=src||'';
      source.type='video/mp4';
      videoPlayer.appendChild(source);

      if(currentUser){
        const snapshot=await db.ref(`resume/${currentUser.uid}/${title}`).once('value');
        if(snapshot.exists()) videoPlayer.currentTime=snapshot.val();
      }

      videoPlayer.ontimeupdate=()=>{
        if(!videoPlayer.paused) saveResumeTime(title,videoPlayer.currentTime);
      };

      if(subs){
        const track=document.createElement('track');
        track.src=subs;
        track.kind='subtitles';
        track.srclang='en';
        track.label='English';
        videoPlayer.appendChild(track);
      }

      videoPlayer.setAttribute("playsinline","");
      videoPlayer.setAttribute("webkit-playsinline","");
      videoPlayer.load();
      videoPlayer.play().catch(()=>{});
    }

    function saveResumeTime(title,time){
      if(currentUser){
        db.ref(`resume/${currentUser.uid}/${title}`).set(time);
      }
    }

    function closePlayer(){
      const videoPlayer=document.getElementById('videoPlayer');
      videoPlayer.pause();
      showPage('home');
    }

    function logout(){
      auth.signOut();
    }
  </script>
</body>
</html>
