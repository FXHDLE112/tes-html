<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FahadFlix</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, Helvetica, sans-serif; }
    body { background: #141414; color: #fff; }
    header { padding: 1rem; background: #000; display: flex; justify-content: space-between; align-items: center; }
    header h1 { font-size: 1.5rem; color: #e50914; }
    #movies { 
      display: grid; 
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); 
      gap: 1rem; 
      padding: 1rem; 
    }
    .movie-card { background: #222; padding: 1rem; border-radius: 10px; }
    .movie-card h3 { font-size: 1.1rem; margin-bottom: .5rem; }
    video { width: 100%; border-radius: 10px; }
  </style>
</head>
<body>
  <header>
    <h1>FahadFlix</h1>
    <button onclick="signOut()">Sign Out</button>
  </header>

  <main>
    <h2 style="padding:1rem;">Movies & Shows</h2>
    <div id="movies">Loading...</div>
  </main>

  <script>
    async function fetchMovies() {
      try {
        const response = await fetch("https://raw.githubusercontent.com/FXHDLE112/tes-html/refs/heads/main/movies.json");
        if (!response.ok) throw new Error("Failed to fetch movies.json");

        const movies = await response.json();
        console.log("Movies loaded:", movies);

        const container = document.getElementById("movies");
        container.innerHTML = "";

        Object.values(movies).forEach(movie => {
          const card = document.createElement("div");
          card.className = "movie-card";
          card.innerHTML = `
            <h3>${movie.title}</h3>
            <video controls>
              <source src="${movie.url}" type="video/mp4">
              Your browser does not support video.
            </video>
          `;
          container.appendChild(card);
        });

      } catch (error) {
        console.error("Error fetching movies:", error);
        document.getElementById("movies").innerText = "Failed to load movies.";
      }
    }

    function signOut() {
      alert("Sign out logic here");
      // Firebase auth signOut() can stay if you want auth protection
    }

    document.addEventListener("DOMContentLoaded", fetchMovies);
  </script>
</body>
</html>
